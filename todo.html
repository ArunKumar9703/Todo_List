<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>To-Do Page</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 420px; margin: 40px auto; }
    label { display: block; margin-top: 12px; font-weight: bold; }
    input, textarea { width: 100%; padding: 8px; box-sizing: border-box; }
    button { margin-top: 16px; padding: 10px 18px; cursor: pointer; }
    #message { margin-top: 14px; }
  </style>
</head>
<body>
  <h2>To-Do Page</h2>

  <form id="todoForm">
    <label for="itemName">Item Name</label>
    <input type="text" id="itemName" name="itemName" required>

    <label for="itemDescription">Item Description</label>
    <textarea id="itemDescription" name="itemDescription" rows="4" required></textarea>

    <button type="submit">Add Item</button>
  </form>

  <p id="message"></p>

  <script>
    document.getElementById("todoForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const payload = {
        itemName: document.getElementById("itemName").value,
        itemDescription: document.getElementById("itemDescription").value
      };
      try {
        const res = await fetch("/submittodoitem", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        document.getElementById("message").textContent = data.message;
        if (res.ok) e.target.reset();
      } catch (err) {
        document.getElementById("message").textContent = "Could not reach the server.";
      }
    });
  </script>
</body>
</html>
